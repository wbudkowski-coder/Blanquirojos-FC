<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blanquirojos F.C. | Costa Blanca</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Nowa kolorystyka wyciągnięta bezpośrednio z Herbu */
            --red: #8b1e2b;          /* Bordo / Ciemna Czerwień */
            --red-hover: #6e1620;    /* Ciemniejsza bordo */
            --gold: #c2ab87;         /* Złoto / Beż z napisu i obramowań */
            --gold-light: #d8c7a9;   /* Jasne złoto */
            --dark: #121417;         /* Ciemne grafitowe tło */
            --dark-card: #1a1d24;    /* Tło kart i elementów */
            --white: #ffffff;
            --light: #f4f4f6;
            --gray: #8c92a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* HEADER */

        header {
            background: var(--dark);
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* LOGO DRUŻYNY W NAGŁÓWKU */
        .logo-container {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dark);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand h1 {
            font-size: 22px;
            letter-spacing: 1px;
            color: var(--white);
        }

        .social-links {
            display: flex;
            gap: 14px;
        }

        .social-links a {
            color: white;
            font-size: 21px;
            text-decoration: none;
            transition: 0.2s;
        }

        .social-links a:hover {
            color: var(--gold);
        }

        /* HERO */

        .hero {
            background:
                linear-gradient(rgba(18, 20, 23, 0.85), rgba(18, 20, 23, 0.85)),
                url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1600&q=80")
                center/cover;

            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .hero-content {
            max-width: 900px;
        }

        .hero h2 {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 10px;
            color: var(--white);
        }

        .hero p {
            font-size: 22px;
            color: var(--gold-light);
            margin-bottom: 30px;
        }

        .hero-button {
            display: inline-block;
            background: var(--red);
            color: white;
            padding: 13px 28px;
